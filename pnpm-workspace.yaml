packages:
  - app/apex
  - app/core
  - app/docs
  - app/help
  - app/info
  - app/news
  - com/apex
  - com/core
  - com/docs
  - com/help
  - com/info
  - com/news
  - dev/apex
  - net/apex
  - org/apex
  - org/core
  - org/docs
  - org/help
  - org/info
  - org/news

allowBuilds:
  # Unlike every other entry here, hurl has NO prebuilt binary inside the
  # tarball: the npm package is a thin installer whose postinstall fetches the
  # Rust binary for the host platform from the project's GitHub release. Denying
  # the script does not degrade the package, it leaves `hurl` absent and
  # `pnpm test:api` failing with ENOENT. This is the one place in the toolchain
  # where `ignore-scripts=true` has to be relaxed, and it is relaxed for a
  # version-pinned devDependency that never reaches a Worker bundle.
  '@orangeopensource/hurl': true
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

catalog:
  '@astrojs/cloudflare': 14.3.0
  # React islands on the twelve Astro publishing homes. Pinned next to Astro so
  # the content surfaces cannot drift onto an integration the 7.3 line rejects.
  '@astrojs/react': 6.0.5
  '@cloudflare/vite-plugin': ^1.54.3
  '@cloudflare/workers-types': ^5.20260903.1
  '@fontsource-variable/inter': ^5.3.0
  '@hono/structured-logger': ^1.0.0
  # Hurl is a Rust binary; this package is the official npm distribution of it
  # (bins `hurl` and `hurlfmt`). Installing it as a devDependency rather than
  # documenting a `brew`/`apt`/`cargo` step is what keeps pnpm the only entry
  # point a contributor needs — and what makes the HTTP-contract suite run at
  # the same version on a laptop and in CI. Catalogued for the same reason the
  # rest of the toolchain is: twenty units must not drift apart.
  '@orangeopensource/hurl': ^8.0.4
  # The browser-test runtime, in twenty units. It pins the wire protocol as
  # well as the API, so two units on different minors drive two different
  # browsers. This sat as an identical literal in every manifest with nothing
  # enforcing it — syncpack's catalog policy now does (see .syncpackrc.json).
  '@playwright/test': ^1.62.1
  # Size Limit's file plugin. `size-limit` itself and its plugins must move in
  # lockstep — the plugin package declares an EXACT peer on the runner
  # ("size-limit": "13.0.3"), so a drift here is a resolution failure, not a
  # subtle one. The preset packages are deliberately not used: @size-limit/time
  # (which preset-app pulls in) needs a headless Chrome that neither CI nor the
  # Containerfile installs — the same reason `test:e2e` is not a CI gate.
  '@size-limit/file': ^13.0.3
  # Tailwind v4 has no JS config file: the theme is declared in each unit's own
  # stylesheet with `@theme`. One engine, one delivery mechanism, because every
  # unit builds with Vite: `@tailwindcss/vite`.
  #
  # Neither of the other two front ends is installed. `@tailwindcss/postcss`
  # would need a PostCSS pipeline, and there is none. `@tailwindcss/cli` was how
  # the apex Workers got a stylesheet before they had a bundler — `wrangler
  # deploy` bundles the entrypoint and copies `public/` byte for byte, so
  # nothing in that path could process CSS — and it was catalogued with no
  # consumer until ADR 012 moved the last apex to Vite.
  #
  # `tailwindcss` and `@tailwindcss/vite` are pinned here rather than per unit
  # so the twenty units cannot drift onto different Tailwind versions.
  '@tailwindcss/vite': ^4.3.3
  # TanStack Router and TanStack Start, the framework behind all fifteen frames.
  # They move in lockstep — Start's peer range pins Router — so a per-unit drift
  # is a resolution failure rather than a subtle one. Start is a `dependency`
  # rather than a devDependency: unlike Vite, it IS in the request path, because
  # `wrangler.jsonc` names `@tanstack/react-start/server-entry` as `main`.
  #
  # Start is at Release Candidate, not GA. Pin the minor and read the changelog
  # before bumping — that is one of the four constraints in
  # adr/013-frames-tanstack-start.md, not a preference.
  '@tanstack/react-router': ^1.170.32
  '@tanstack/react-start': ^1.168.49
  # The DOM-assertion and DOM-implementation halves of the Vitest setup. Every
  # unit's vitest.setup.ts imports `@testing-library/jest-dom`, and every
  # vitest.config.ts names happy-dom as its environment, so a per-unit drift
  # here changes what a test MEANS rather than whether it runs.
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@types/node': ^26.5.1
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.7
  # React Fast Refresh and the JSX transform for the Vite-built units. The five
  # apex Workers do not install it — they render with hono/jsx and have no React
  # at all (docs/design/ui-shell-contract.md §3a).
  '@vitejs/plugin-react': ^6.1.1
  # Exact, not a range, and deliberately so: V8 coverage remapping has to match
  # the vitest it instruments, and this was already an exact literal in all
  # twenty-two manifests. Catalogued to keep it that way from one place.
  '@vitest/coverage-v8': 5.0.0
  # The spell checker. Pinned here rather than per unit because the dictionary
  # it reads (.cspell/project-words.txt) is repository-wide: a unit resolving a
  # different major could disagree about what the config file even means.
  # Astro (unscoped). See '@astrojs/cloudflare' above for the pilot rationale.
  astro: 7.3.1
  cspell: ^10.3.0
  dependency-cruiser: ^18.2.0
  happy-dom: ^20.13.2
  hono: ^4.13.7
  knip: ^6.35.1
  # The static analysis toolchain. These were literal strings in twenty-two
  # manifests until they drifted (knip sat at 6.32.1 in every unit and 6.32.2 at
  # the root), which is exactly the failure a catalog exists to prevent: a lint
  # or type rule that fires in CI and not on a developer's machine is worse than
  # the rule being off. oxlint and oxlint-tsgolint in particular have to move
  # together — tsgolint is the type-aware backend oxlint shells out to.
  oxfmt: ^0.67.0
  oxlint: 1.82.0
  oxlint-tsgolint: ^7.0.2001
  react: ^19.2.8
  react-aria-components: ^1.21.0
  react-dom: ^19.2.8
  # The frontend performance budget runner. See '@size-limit/file' above for why
  # the two move together and why no preset is used.
  size-limit: ^13.0.3
  # Workspace dependency-consistency checking. It reads this very file — the
  # catalog definitions and the `catalog:` specifiers pointing at them — so it
  # belongs to the repository root rather than to any unit.
  syncpack: ^15.3.3
  tailwindcss: ^4.3.3
  # The official Tailwind plugin for react-aria-components, which turns the
  # library's `data-hovered` / `data-pressed` / `data-focus-visible` attributes
  # into first-class variants (`hovered:`, `pressed:`, `focus-visible:`). Only
  # the units that actually render a React Aria component install it; v2 is the
  # Tailwind v4 line (v1.x is for Tailwind v3).
  tailwindcss-react-aria-components: ^2.2.0
  # TypeScript 7.0 went stable on 2026-07-08 and `tsc` is now the native (Go)
  # compiler itself; `tsgo` only survives as the binary name inside the
  # `@typescript/native-preview` nightlies, which this repository no longer
  # installs. Every unit declares `typescript: catalog:` explicitly rather than
  # leaning on root hoisting, so an extracted unit still resolves a compiler.
  typescript: ^7.0.2
  # The build tool for every deployment unit — the five apex Hono Workers and the
  # fifteen TanStack Start frames. It is a devDependency everywhere it appears
  # and must stay one — nothing Vite ships may reach a Worker bundle, which is
  # the property `pnpm --dir <unit> run build` then inspecting `dist/` checks.
  #
  # Vitest already resolves a transitive copy of Vite; this entry is the direct,
  # version-pinned one, so the two cannot disagree about which major is in play.
  vite: ^8.2.2
  vitest: ^5.0.0
  # Floor set by `@cloudflare/vite-plugin`'s peer range (^4.127.0), not chosen
  # independently. Bumping the plugin without bumping this is a resolution
  # failure rather than a subtle one.
  wrangler: ^4.130.0

ignoredBuiltDependencies:
  - esbuild
  - sharp
  - workerd

# Hold newly published versions back so a compromised release has time to be
# pulled from the registry before it can be installed here.
#
# 1440 is also pnpm 11's default, so this line changes no version by itself.
# It is spelled out because leaving it implicit costs the two settings below:
# `minimumReleaseAgeStrict` only defaults to true when `minimumReleaseAge` is
# set EXPLICITLY. Implicit meant strict=false, and strict=false makes pnpm fall
# back to a version that violates the delay whenever no aged version satisfies
# the range — the delay reads as enforced while quietly not being. Explicit also
# survives a pnpm major that changes its own default.
minimumReleaseAge: 1440

# Fail resolution instead of silently installing a too-young version. If this
# ever blocks an update, the fix is to wait out the window or add a justified
# entry to minimumReleaseAgeExclude below — not to turn this off.
minimumReleaseAgeStrict: true

# Refuse to install rather than skip the age check when registry metadata has no
# `time` field. The default (true) is a silent bypass for the WHOLE policy, and
# this repository installs from a private registry (registry=https://npm.flatt.tech/
# in .npmrc) rather than registry.npmjs.org — exactly the mirror case pnpm warns
# omits `time`. That registry does serve `time` today (verified against its
# wrangler metadata), so this costs nothing now and turns a future mirror change
# from a silent loss of protection into a loud failure.
minimumReleaseAgeIgnoreMissingTime: false

# Live exceptions, not dead config: with the delay in force these are the pins
# that were bumped inside their own release window. Toolchain-only and pinned
# exactly, so the exposure is a deliberate, reviewed version rather than
# "whatever is newest". Re-check when bumping — an entry kept past its bump is
# a standing hole.
#
# Empty today, and every removal was a version clearing the delay on its own
# rather than the policy being relaxed:
#
#   wrangler@4.120.1              the catalog floor moved to ^4.124.0 for
#                                 `@cloudflare/vite-plugin`'s peer range, and
#                                 4.124.0 was already aged.
#   miniflare@5.20260804.0-alpha  the lockfile resolves 5.20260831.0-alpha; the
#                                 pinned version was not installed any more, so
#                                 the entry excepted nothing.
#   astro@7.3.1                   published 2026-09-03T13:29Z.
#   @astrojs/cloudflare@14.3.0    published 2026-09-03T10:29Z.
#   vitest@5.0.0 / @vitest/*      published 2026-09-03T12:24Z.
#
# The last three aged past the 1440-minute window on 2026-09-04, which is what
# their own comments said to wait for. Verified by `pnpm install` re-checking
# all 854 lockfile entries against the policy with this list empty.
minimumReleaseAgeExclude: []

audit:
  ignore:
    # @orangeopensource/hurl@8.0.4 uses extract-zip only in its install script
    # to unpack Hurl's fixed GitHub release archive. GHSA-jmr9-qjv8-65gv names
    # 2.0.2 as the patched floor, but npm publishes no version after 2.0.1 and
    # Hurl has no newer release. Remove this exception as soon as either exists.
    - GHSA-jmr9-qjv8-65gv

peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: '*'
